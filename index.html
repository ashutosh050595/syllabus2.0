
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacred Heart | Lesson Plan Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
                  @keyframes blob {
              0% {
                transform: translate(0px, 0px) scale(1);
              }
              33% {
                transform: translate(30px, -50px) scale(1.1);
              }
              66% {
                transform: translate(-20px, 20px) scale(0.9);
              }
              100% {
                transform: translate(0px, 0px) scale(1);
              }
            }
            
            @keyframes float {
              0%, 100% {
                transform: translateY(0) rotate(0deg);
              }
              50% {
                transform: translateY(-20px) rotate(180deg);
              }
            }
            
            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-5px); }
              75% { transform: translateX(5px); }
            }
            
            .animate-blob {
              animation: blob 7s infinite;
            }
            
            .animation-delay-2000 {
              animation-delay: 2s;
            }
            
            .animation-delay-4000 {
              animation-delay: 4s;
            }
            
            .animate-float {
              animation: float 6s ease-in-out infinite;
            }
            
            .animate-shake {
              animation: shake 0.5s ease-in-out;
            }
                  
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
          radial-gradient(at 0% 0%, hsla(220, 100%, 95%, 1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(260, 100%, 95%, 1) 0, transparent 50%),
          radial-gradient(at 50% 100%, hsla(210, 100%, 92%, 1) 0, transparent 50%);
        opacity: 0.8;
      }

      @media print {
        @page { 
          size: A4 portrait; 
          margin: 0; 
        }
        
        /* 1. Hide everything by default */
        html, body, #root, header, footer, nav, button, .print-hidden, .mesh-bg {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        /* 2. Show only the report and its parents as blocks */
        html, body, #root, div:has(> #report-preview) {
          display: block !important;
          visibility: visible !important;
          height: auto !important;
          background: white !important;
        }

        #report-preview {
          display: block !important;
          visibility: visible !important;
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 15mm !important;
          border: none !important;
          box-shadow: none !important;
          background: white !important;
          z-index: 999999 !important;
          transform: none !important;
        }

        #report-preview * {
          visibility: visible !important;
        }

        /* Table Fidelity */
        table { 
          border-collapse: collapse !important; 
          width: 100% !important; 
          border: 1.5pt solid black !important; 
        }
        th, td { 
          border: 1pt solid black !important; 
          padding: 8pt !important; 
          color: black !important; 
          -webkit-print-color-adjust: exact;
        }
      }
    </style>

}
