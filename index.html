
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacred Heart | Lesson Plan Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc; /* Slate 50 - High Clarity */
        color: #0f172a; /* Slate 900 - High Contrast */
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
          radial-gradient(at 0% 0%, hsla(220, 100%, 95%, 1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(260, 100%, 95%, 1) 0, transparent 50%),
          radial-gradient(at 50% 100%, hsla(210, 100%, 92%, 1) 0, transparent 50%);
        opacity: 0.8;
      }

      .glass-card {
        background: #ffffff;
        border: 1px solid #e2e8f0; /* Slate 200 */
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      .input-glass {
        background: #ffffff !important;
        border: 2px solid #e2e8f0 !important;
        color: #0f172a !important;
        transition: all 0.2s ease;
      }

      .input-glass:focus {
        border-color: #4f46e5 !important; /* Indigo 600 */
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }

      @media print {
        @page { size: landscape; margin: 5mm; }
        body { background: white !important; color: black !important; }
        .print-hidden { display: none !important; }
        #report-preview {
          visibility: visible !important;
          position: absolute;
          left: 0; top: 0;
          width: 100%;
          border: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          background: white !important;
          color: black !important;
        }
        table { border-collapse: collapse; width: 100%; border: 2px solid #000; }
        th, td { border: 1px solid #000 !important; padding: 10px; color: black !important; font-size: 11px; }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0?external=react",
    "firebase/app": "https://esm.sh/firebase@11.3.1/app",
    "firebase/auth": "https://esm.sh/firebase@11.3.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@11.3.1/firestore",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "react/": "https://esm.sh/react@19.0.0/",
    "firebase/": "https://esm.sh/firebase@11.3.1/"
  }
}
</script>
  </head>
  <body>
    <div class="mesh-bg"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
