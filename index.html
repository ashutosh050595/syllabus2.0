
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacred Heart | Lesson Plan Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #030712;
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: 
          radial-gradient(at 0% 0%, hsla(263,45%,15%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,50%,15%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,55%,15%,1) 0, transparent 50%),
          radial-gradient(at 0% 100%, hsla(280,50%,15%,1) 0, transparent 50%),
          radial-gradient(at 100% 100%, hsla(210,50%,15%,1) 0, transparent 50%);
        opacity: 0.9;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }

      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
      }

      .input-glass {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: white !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .input-glass:focus {
        border-color: #6366f1 !important;
        background: rgba(255, 255, 255, 0.06) !important;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }

      @keyframes aurora-shift {
        0% { filter: hue-rotate(0deg); transform: scale(1); }
        50% { filter: hue-rotate(15deg); transform: scale(1.05); }
        100% { filter: hue-rotate(0deg); transform: scale(1); }
      }

      .aurora-bg {
        animation: aurora-shift 15s infinite ease-in-out;
      }

      @media print {
        @page { size: landscape; margin: 5mm; }
        body { background: white !important; color: black !important; }
        .print-hidden { display: none !important; }
        #report-preview {
          visibility: visible !important;
          position: absolute;
          left: 0; top: 0;
          width: 100%;
          border: none !important;
          box-shadow: none !important;
          padding: 0 !important;
          background: white !important;
          color: black !important;
        }
        table { border-collapse: collapse; width: 100%; border: 2px solid #000; }
        th, td { border: 1px solid #000 !important; padding: 10px; color: black !important; font-size: 11px; }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
  </head>
  <body>
    <div class="mesh-bg aurora-bg"></div>
    <div id="root"></div>
  </body>
</html>
